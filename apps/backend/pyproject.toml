[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warehouse-api"
version = "0.1.0"
description = "Technical API scaffold for Warehouse & Smart Inventory Management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.123,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_api"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
